services:
  db:
    image: postgres:16-alpine
    container_name: revoshop-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-revoshop_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - revoshop-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-revoshop_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: revoshop-web
    command: ["flask", "run", "--host", "0.0.0.0", "--port", "5000"]
    environment:
      FLASK_ENV: development
      FLASK_APP: run:application
      FLASK_DEBUG: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-revoshop_db}
      DB_HOST: db
      DB_PORT: "5432"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-me}
    ports:
      - "${WEB_PORT:-5000}:5000"
    volumes:
      - .:/app
      - /app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - revoshop-net

volumes:
  pgdata:

networks:
  revoshop-net:
    driver: bridge
